name: Build LongCat Worker

concurrency:
  group: longcat-worker-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [dev, main]
    paths:
      - 'longcat-worker/**'
      - '.github/workflows/longcat-worker.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set lowercase repo owner
        id: owner
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.owner.outputs.owner }}/lucasarrial-longcat
          tags: |
            type=ref,event=branch
            type=sha,prefix=,format=short

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./longcat-worker
          file: ./longcat-worker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Deploy manual por enquanto (frontend/_deploy_longcat_worker.cjs <sha7>):
  # secret RUNPOD_API_KEY ausente no GitHub (mesma pendência do worker VOX).
